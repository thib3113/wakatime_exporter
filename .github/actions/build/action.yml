name: 'Build and push release'
inputs:
  VERSION:
    description: 'The release version (e.g. v1.2.3)'
    required: true
  IMAGES:
    description: 'Newline-separated list of image names (without tag)'
    required: true
  GITHUB_TOKEN:
    description: 'github token'
    required: true
  DOCKERHUB_USERNAME:
    description: 'docker username (empty skips the Docker Hub push)'
    required: false
    default: ''
  DOCKERHUB_TOKEN:
    description: 'docker token'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Setup QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ inputs.IMAGES }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.VERSION }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.VERSION }}
          type=semver,pattern={{major}},value=${{ inputs.VERSION }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: ${{ inputs.DOCKERHUB_USERNAME != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.DOCKERHUB_USERNAME }}
        password: ${{ inputs.DOCKERHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: true
        build-args: "VERSION=${{ inputs.VERSION }}"
