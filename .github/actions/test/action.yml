name: 'Test Go build and Docker image'
inputs:
  TEST_TAG:
    description: 'Local tag for the test image'
    required: false
    default: wakatime-exporter:test

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Build
      shell: bash
      run: go build ./...

    - name: Vet
      shell: bash
      run: go vet ./...

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build and export to Docker
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        load: true
        tags: ${{ inputs.TEST_TAG }}
        context: .

    - name: Smoke test
      shell: bash
      env:
        TEST_TAG: ${{ inputs.TEST_TAG }}
      run: |
        docker run -d --name waka-test -p 9212:9212 "${TEST_TAG}" --wakatime.api-key=dummy --wakatime.timeout=5s
        trap 'docker rm -f waka-test' EXIT
        for i in $(seq 1 30); do
          curl -sf http://localhost:9212/ | grep -q Metrics && break
          sleep 1
        done
        curl -sf http://localhost:9212/ | grep -q Metrics
        # A dummy key fails the WakaTime scrape, but the exporter itself must
        # stay up and expose per-collector success metrics.
        curl -sf http://localhost:9212/metrics | grep -q wakatime_scrape_collector_success
