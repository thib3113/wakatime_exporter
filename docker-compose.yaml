version: '3'

networks:
  wakatime-exporter:

services:
  wakatime-exporter:
    image: thib3113/wakatime-exporter:latest
    ports:
      - '9212:9212'
    environment:
      WAKA_API_KEY: '${WAKA_API_KEY}'
    networks:
      - wakatime-exporter

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    ports:
      - '3000:3000'
    volumes:
      - ./docs/dashboards:/etc/dashboards
      - ./docs/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./docs/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - wakatime-exporter

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports:
      - 9090:9090
    volumes:
      - ./docs/example/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    networks:
      - wakatime-exporter
