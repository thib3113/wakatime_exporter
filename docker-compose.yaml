version: '3'

networks:
  wakatime-exporter:

services:
  wakatime-exporter:
    image: thib3113/wakatime-exporter:latest
    ports:
      - '9212:9212'
    environment:
      WAKA_API_KEY: '${WAKA_API_KEY}'
    networks:
      - wakatime-exporter

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    ports:
      - '3000:3000'
    volumes:
      - ./docs/dashboards:/etc/dashboards
      - ./docs/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./docs/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - wakatime-exporter

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    ports:
      - 9090:9090
    volumes:
      - ./docs/example/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    networks:
      - wakatime-exporter
